<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — Loan Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="page-head">
      <div><h1>Emails</h1><p>Every reminder, alert and confirmation, and whether it was delivered.</p></div>
    </div>

    <section class="card">
      <form id="filter-form" class="row" style="align-items:end">
        <div><label for="type">Type</label>
          <select id="type" name="type"><option value="">Any</option><option value="DUE_SOON">Due soon</option><option value="OVERDUE">Overdue</option><option value="LATE_FEE">Late fee</option><option value="PAYMENT_REJECTED">Payment rejected</option><option value="ESCALATION">Escalation</option><option value="PAYMENT_CONFIRMED">Payment confirmed</option><option value="PLAN_COMPLETED">Plan completed</option></select></div>
        <div><label for="status">Status</label>
          <select id="status" name="status"><option value="">Any</option><option value="SENT">Sent</option><option value="FAILED">Failed</option></select></div>
        <div class="actions"><button type="submit">Filter</button></div>
      </form>
    </section>

    <section class="card">
      <div class="card-head"><h2 id="count">Notifications</h2></div>
      <div class="table-wrap"><table>
        <thead><tr><th>When</th><th>Type</th><th>Plan</th><th>Email</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
